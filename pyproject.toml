[project]
name = "operational-capacity"
version = "0.1.0"
description = "Motor de cálculo para o Simulador de Capacidade Operacional."
requires-python = ">=3.11,<3.15"
dependencies = [
    "duckdb==1.5.6",
    "streamlit==1.64.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
